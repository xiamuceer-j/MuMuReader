name: Publish Docker Images

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  docker:
    if: github.repository == 'xiamuceer-j/MuMuReader'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: standard
            java-distribution: temurin
            dockerfile: ./.github/workflows/Dockerfile
            flavor: |
              latest=true
            platforms: |
              linux/amd64
              linux/arm64
              linux/arm/v6
              linux/arm/v7
              linux/386
              linux/ppc64le
              linux/s390x
          - name: openj9
            java-distribution: semeru
            dockerfile: ./.github/workflows/Openj9-Dockerfile
            flavor: |
              latest=false
              prefix=openj9-,onlatest=true
              suffix=
            platforms: |
              linux/amd64
              linux/arm64/v8
              linux/ppc64le
              linux/s390x
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: '14'
      -
        name: Build web
        run: cd web && npm install && npm run build
      -
        name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: ${{ matrix.java-distribution }}
          java-version: '8'
          cache: 'gradle'
      -
        name: Build Java
        run:
          mv ./web/dist ./src/main/resources/web && rm src/main/java/com/htmake/reader/ReaderUIApplication.kt && gradle -b cli.gradle assemble --info && mv ./build/libs/*.jar ./reader.jar
      -
        name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            mumujie/mumureader
          flavor: ${{ matrix.flavor }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref, 'beta') }}
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ matrix.platforms }}
